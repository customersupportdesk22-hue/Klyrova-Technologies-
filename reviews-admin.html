<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Review management | Klyrova</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"><style>
:root{font-family:"DM Sans",sans-serif;color:#132747;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1050px;margin:40px auto;padding:0 18px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:24px}.top h1{font:800 25px Manrope;margin:0}.muted{color:#738198;font-size:13px}.panel,.review{background:#fff;border:1px solid #e3eaf3;border-radius:14px;padding:22px;margin-bottom:14px;box-shadow:0 8px 24px #193a6408}.login{max-width:470px;margin:10vh auto}.field{display:block;width:100%;padding:13px;border:1px solid #dce5f0;border-radius:8px;margin:9px 0 13px;font:inherit}.btn{border:0;border-radius:8px;padding:11px 16px;font-weight:700;cursor:pointer}.primary{background:#087cf0;color:white}.approve{background:#e7f8ee;color:#13753c}.reject{background:#fff1e9;color:#a84d22}.delete{background:#fcebec;color:#ad2834}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tab{background:#e8eef7;color:#334965}.tab.active{background:#102c54;color:white}.review h3{margin:4px 0 8px}.review p{line-height:1.7;white-space:pre-wrap}.meta{color:#738198;font-size:12px;line-height:1.8}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.status{font-size:12px;font-weight:700;text-transform:uppercase;color:#51708f}.hidden{display:none!important}@media(max-width:600px){.wrap{margin:22px auto}.panel,.review{padding:17px}.top{align-items:flex-start;flex-direction:column}}
</style>  <script src="navigation.js" defer></script>
</head><body><main class="wrap"><header class="top"><div><p class="muted">KLYROVA TECHNOLOGIES</p><h1>Customer review management</h1></div><a href="/" class="muted">View website ↗</a></header>
<section class="panel login" id="login-panel"><h2>Admin access</h2><p class="muted">Enter the review admin token configured privately in your hosting environment.</p><input class="field" id="admin-token" type="password" autocomplete="current-password" placeholder="Admin access token"><button class="btn primary" id="login-button">Open reviews</button><p class="muted" id="login-message" role="status"></p></section>
<section id="dashboard" class="hidden"><div class="panel"><b>Review moderation</b><p class="muted">Only approved reviews appear on the public homepage. Customer contact details are private and are never shown publicly.</p><div class="tabs"><button class="btn tab active" data-status="pending">Pending</button><button class="btn tab" data-status="approved">Approved</button><button class="btn tab" data-status="rejected">Rejected</button><button class="btn tab" data-status="all">All</button></div><p class="muted" id="admin-message" role="status"></p></div><div id="review-list"></div></section></main><script src="reviews-admin.js"></script></body></html>
