<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">CoinWave V2 cryptocurrency trading visual</title>
<desc id="desc">A glowing gold Bitcoin coin in front of a navy global market chart with rising candlesticks and blue and gold trend lines.</desc>
